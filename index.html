<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Student Task Board!</h1>
        </header>

        <div class="task-input-section">
            <h2>Add New Task</h2>
            <div class="input-group">
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Enter your task here..." 
                    maxlength="200"
                >
                <button id="addTaskBtn" onclick="addTask()">Add Task</button>
            </div>
            <p class="error-message" id="errorMessage"></p>
        </div>

        <div class="tasks-section">
            <div class="tasks-header">
                <h2>Your Tasks</h2>
                <button id="clearAllBtn" onclick="clearAllTasks()" class="clear-btn">Clear All</button>
            </div>
            <div id="tasksContainer">
                <p class="empty-message" id="emptyMessage">No tasks yet. Add your first task above!</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
